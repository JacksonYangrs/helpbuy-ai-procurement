    <script>
      window.__HELPBUY_EMBED = true;
      window.__HELPBUY_BASE = "../assets/";
      window.__HELPBUY_BOOT = function () {
        const target = document.getElementById("full-document");
        window.HELPBUY_MD.render({
          content: window.HELPBUY_DOCS.prd,
          target,
          baseHref: "../assets/",
          onError: "完整方案暂时无法加载。请使用右上角“下载完整 Markdown”获取原文。"
        }).then(() => { target.classList.remove("is-loading"); });
        const downloadEl = document.getElementById("download-link");
        downloadEl.addEventListener("click", function (e) {
          e.preventDefault();
          var blob = new Blob([window.HELPBUY_DOCS.prd], { type: "text/markdown;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = "HELPBUY_PRD_V2_商业计划与产品方案.md";
          document.body.appendChild(a); a.click();
          document.body.removeChild(a); URL.revokeObjectURL(url);
        });
      };
    </script>
